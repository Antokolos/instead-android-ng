name: pr-description

on:
  pull_request:
    types: [ opened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  describe:
    # Автозаполнение работает для PR из веток этого же репозитория:
    # у PR из форков GITHUB_TOKEN только на чтение.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- AUTO-DESCRIPTION -->';
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Ручное описание не трогаем: заполняем только пустое или шаблон.
            if (!body.includes(marker) && body.trim().length > 0) {
              core.info('PR body is custom, skipping auto-description');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = pr.number;

            const commitsResponse = await github.rest.pulls.listCommits({
              owner, repo, pull_number: number, per_page: 100
            });
            const filesResponse = await github.rest.pulls.listFiles({
              owner, repo, pull_number: number, per_page: 100
            });
            const commits = commitsResponse.data;
            const files = filesResponse.data;

            const areas = [...new Set(files.map(f => f.filename.split('/').slice(0, 2).join('/')))];

            const lines = [];
            lines.push('## Автоматическая сводка');
            lines.push('');
            lines.push(`**Коммиты (${commits.length}):**`);
            for (const commit of commits.slice(0, 20)) {
              lines.push(`- ${commit.commit.message.split('\n')[0]}`);
            }
            if (commits.length > 20) {
              lines.push(`- … ещё ${commits.length - 20}`);
            }
            lines.push('');
            lines.push(`**Файлов изменено:** ${files.length}`);
            if (areas.length > 0) {
              lines.push('');
              lines.push('**Затронутые области:**');
              for (const area of areas.slice(0, 20)) {
                lines.push(`- \`${area}\``);
              }
            }

            const generated = lines.join('\n');
            const newBody = body.includes(marker)
              ? body.replace(marker, generated)
              : generated;

            await github.rest.pulls.update({
              owner, repo, pull_number: number, body: newBody
            });
            core.info('PR description filled from commits and changed files');
