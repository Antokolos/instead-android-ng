name: android

on:
  push:
    branches: [ modernization, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Пакет tools удалён из Android SDK; по умолчанию action пытается его
          # поставить и падает с "Failed to find package 'tools'".
          packages: "platform-tools"

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create CI keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/ci.jks -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-password -keypass ci-password \
            -dname "CN=CI, OU=CI, O=Instead, L=CI, C=RU"

      - name: Build AAB
        env:
          INSTEAD_KEYSTORE: keystore/ci.jks
          INSTEAD_KEYSTORE_PASSWORD: ci-password
          INSTEAD_KEY_ALIAS: ci
          INSTEAD_KEY_PASSWORD: ci-password
        run: ./gradlew :launcher:bundleRelease :games:redhood:bundleRelease :launcher:assembleDebug :games:redhood:assembleDebug --no-daemon

      - name: Verify 16 KB alignment
        run: |
          bash scripts/verify-16kb.sh launcher/build/outputs/bundle/release/launcher-release.aab
          bash scripts/verify-16kb.sh games/redhood/build/outputs/bundle/release/redhood-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: |
            launcher/build/outputs/bundle/release/*.aab
            games/redhood/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            launcher/build/outputs/apk/debug/*.apk
            games/redhood/build/outputs/apk/debug/*.apk
          if-no-files-found: error
